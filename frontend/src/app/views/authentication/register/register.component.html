<c-container>
  <c-row class="justify-content-center">
    <c-col lg="6" md="8" xl="5">
      <div class="d-flex flex-column gap-4">
        <div class="text-center">
          <h1 class="h3">MisFinanzas</h1>
        </div>
        <c-card class="p-4">
          <c-card-body class="d-flex flex-column gap-4">
            <h2 class="h5 text-center mb-0">Crea tu cuenta</h2>
            @if (errorMessage()) {
              <c-alert color="danger">{{ errorMessage() }}</c-alert>
            }
            <form cForm cRow class="gy-3" [formGroup]="form" (ngSubmit)="submit()">
              <c-col xs="12">
                <label cLabel for="name">Nombre</label>
                <input autocomplete="name" cFormControl formControlName="name" id="name" placeholder="Tu nombre" type="text" />
              </c-col>
              <c-col xs="12">
                <label cLabel for="email">Correo electrónico</label>
                <input autocomplete="email" cFormControl formControlName="email" id="email" placeholder="tu@correo.com" type="email" />
              </c-col>
              <c-col xs="12">
                <label cLabel for="password">Contraseña</label>
                <input autocomplete="new-password" cFormControl formControlName="password" id="password" placeholder="Mínimo 8 caracteres" type="password" />
              </c-col>
              <c-col xs="12">
                <button cButton class="w-100" color="primary" type="submit" [disabled]="loading()">
                  {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
                </button>
              </c-col>
            </form>
          </c-card-body>
        </c-card>
        <div class="text-center text-body-secondary">
          ¿Ya tienes cuenta? <a routerLink="/authentication/login">Ingresa</a>
        </div>
      </div>
    </c-col>
  </c-row>
</c-container>
