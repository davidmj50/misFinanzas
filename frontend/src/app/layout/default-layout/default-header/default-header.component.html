<c-container [fluid]="true">
  <button [cSidebarToggle]="sidebarId()" ariaLabel="Abrir o cerrar navegación" cHeaderToggler class="btn btn-icon" toggle="visible"><svg cIcon name="cilMenu" size="lg"></svg></button>
  <div class="header-context"><span>Tu espacio financiero</span><c-breadcrumb-router /></div>
  <a routerLink="/quick-entry" class="btn btn-primary header-action" aria-label="Registrar movimiento rápido"><span aria-hidden="true">+</span><span class="action-text">Nuevo movimiento</span></a>
  <c-header-nav class="ms-1"><ng-container *ngTemplateOutlet="themeDropdown" /></c-header-nav>
  <c-header-nav class="ms-1"><ng-container *ngTemplateOutlet="userDropdown" /></c-header-nav>
</c-container>

<ng-template #userDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" aria-label="Abrir menú de usuario" cDropdownToggle class="header-user">
      <span class="user-initials" aria-hidden="true">{{ initials() }}</span>
      <span class="user-caption"><strong>{{ currentUser()?.name ?? 'Mi cuenta' }}</strong><small>{{ currentUser()?.role === 'ADMIN' ? 'Administrador' : 'Cuenta personal' }}</small></span>
    </button>
    <ul cDropdownMenu>
      <li><h6 cDropdownHeader class="fw-semibold">{{ currentUser()?.name ?? 'Mi cuenta' }}</h6></li>
      <li><hr cDropdownDivider /></li>
      <li><button type="button" (click)="logout()" cDropdownItem><svg cIcon class="me-2" name="cilAccountLogout"></svg>Cerrar sesión</button></li>
    </ul>
  </c-dropdown>
</ng-template>
<ng-template #themeDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" aria-label="Cambiar apariencia" cDropdownToggle class="btn-icon"><svg [name]="icons()" cIcon size="lg"></svg></button>
    <div cDropdownMenu>
      @for (mode of colorModes; track mode.name) { <button type="button" (click)="colorMode.set(mode.name)" [active]="colorMode() === mode.name" cDropdownItem class="d-flex align-items-center"><svg [name]="mode.icon" cIcon class="me-2" size="lg"></svg>{{ mode.text }}</button> }
    </div>
  </c-dropdown>
</ng-template>
