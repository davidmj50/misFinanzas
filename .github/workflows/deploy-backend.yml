name: Deploy backend (Render)

on:
  workflow_call:
    secrets:
      RENDER_DEPLOY_HOOK_BACKEND:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          curl --fail --show-error --get --data-urlencode "ref=$GITHUB_SHA" "$DEPLOY_HOOK"
