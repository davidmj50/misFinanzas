name: Recordatorios de pagos recurrentes

on:
  schedule:
    - cron: "0 13 * * *" # 08:00 America/Bogota (UTC-5)
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar chequeo de recordatorios
        run: |
          curl --fail --show-error --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "https://misfinanzas-api.onrender.com/api/recurring-payments-notifications/run" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
